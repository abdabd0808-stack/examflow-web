name: Build and Release Student Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter reportlab python-docx pyspellchecker requests pyinstaller

    - name: Build Windows Executable
      if: matrix.os == 'windows-latest'
      run: |
        python -m PyInstaller --onefile --windowed --add-data "nb_NO.dic;." --collect-all customtkinter --collect-all docx student_app.py
        cd dist
        ren student_app.exe student_app.exe

    - name: Build macOS Executable & Zip
      if: matrix.os == 'macos-latest'
      run: |
        python -m PyInstaller --onefile --windowed --add-data "nb_NO.dic:." --collect-all customtkinter --collect-all docx student_app.py
        cd dist
        zip -r student_app_mac.zip student_app.app

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/student_app.exe
          dist/student_app_mac.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
